[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grainmaster-mozume"
version = "0.1.0"
description = "Calibrated instance-level seed phenotyping workstation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "opencv-python>=4.10",
  "scipy>=1.14",
  "scikit-image>=0.24",
  "Pillow>=10.4",
  "pydantic>=2.9",
  "PyYAML>=6.0",
  "colour-science>=0.4.6",
]

[project.optional-dependencies]
model = ["ultralytics>=8.4.174,<9"]
annotation = ["pycocotools>=2.0.11,<3"]
web = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.18"]
dev = ["pytest>=8.3", "pytest-cov>=5.0", "ruff>=0.7", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
