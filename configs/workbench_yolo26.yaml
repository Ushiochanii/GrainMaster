project:
  name: GrainMaster Mozume
  phase: prototype_p0
  acceptance_image: web/assets/example-photo.jpg
model:
  family: YOLO26
  variant: yolo26s-seg
  imgsz: 1024
  class_names:
  - seed
  confidence: 0.25
  device: cpu
calibration:
  ruler:
    enabled: true
    unit: mm
  colorchecker:
    enabled: true
    output_color_space: CIELAB
    qc_metric: deltaE00
    reference_dataset: ColorChecker 2005
    model: root_polynomial2
dish_detection:
  method: classical
  expected_background: blue
  expected_count_for_acceptance_image: 4
measurement:
  length: ellipse_major_axis
  width: ellipse_minor_axis
  area: mask_area
  color:
    space: CIELAB
    statistic: median
    erode_mask: true
prototype:
  export_csv: true
  export_preview: true
  do_resolution_study: false
  do_model_benchmark: false
segmentation:
  backend: yolo26
  weights: weights/seed_v1_yolo26s_seg.pt
geometry_diagnostics:
  enabled: false
  scale_warning_percent: 3.0
  export_candidate_preview: true
spatial_correction:
  enabled: true
paper_labels:
  enabled: false
  model: deepseek-flash
